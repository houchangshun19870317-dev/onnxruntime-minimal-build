name: Build ONNX Runtime Minimal for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        run: |
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          unzip -q protoc-21.12-linux-x86_64.zip -d /usr/local
          chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Install Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r26d

      - name: Write Ops Config
        run: |
          cat > /tmp/include_ops.config << 'OPS_EOF'
Add
Cast
Concat
ConstantOfShape
Conv
Equal
Gather
Identity
If
LSTM
Log
Mul
Neg
Pad
Pow
ReduceMean
Relu
Reshape
Shape
Sigmoid
Slice
Sqrt
Squeeze
Transpose
Unsqueeze
OPS_EOF
          cat /tmp/include_ops.config

      - name: Clone ONNX Runtime
        run: |
          git clone --depth 1 --branch v1.22.0 https://github.com/microsoft/onnxruntime.git /tmp/onnxruntime

      - name: Configure CMake
        run: |
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DONNX_CUSTOM_PROTOC_EXECUTABLE=/usr/local/bin/protoc \
            -Donnxruntime_MINIMAL_BUILD=ON \
            -Donnxruntime_BUILD_SHARED_LIB=ON \
            -Donnxruntime_BUILD_UNIT_TESTS=OFF \
            -Donnxruntime_RUN_ONNX_TESTS=OFF \
            -Donnxruntime_USE_FULL_PROTOBUF=OFF \
            -Donnxruntime_DISABLE_CONTRIB_OPS=ON \
            -Donnxruntime_DISABLE_ML_OPS=ON \
            -Donnxruntime_DISABLE_RTTI=OFF \
            -Donnxruntime_DISABLE_EXCEPTIONS=OFF \
            -Donnxruntime_MINIMAL_BUILD_CUSTOM_OPS=/tmp/include_ops.config \
            -Donnxruntime_USE_OPENMP=OFF \
            -Donnxruntime_USE_XNNPACK=OFF \
            -Donnxruntime_ENABLE_TRAINING=OFF \
            -Donnxruntime_ENABLE_TRAINING_OPS=OFF \
            -Donnxruntime_ENABLE_PYTHON=OFF \
            -Donnxruntime_BUILD_JAVA=OFF \
            -Donnxruntime_BUILD_CSHARP=OFF \
            -Donnxruntime_BUILD_NODEJS=OFF \
            -Donnxruntime_BUILD_OBJC=OFF \
            -Donnxruntime_USE_COREML=OFF \
            -Donnxruntime_USE_DML=OFF \
            -Donnxruntime_USE_CUDA=OFF \
            -Donnxruntime_USE_TENSORRT=OFF \
            -Donnxruntime_USE_ROCM=OFF \
            -Donnxruntime_USE_ARMNN=OFF \
            -Donnxruntime_USE_ACL=OFF \
            -Donnxruntime_USE_SNPE=OFF \
            -Donnxruntime_USE_QNN=OFF \
            -Donnxruntime_USE_PREINSTALLED_EIGEN=OFF \
            -Donnxruntime_ENABLE_LTO=ON \
            -Donnxruntime_ENABLE_MEMLEAK_CHECKER=OFF \
            -S /tmp/onnxruntime/cmake \
            -B /tmp/build

      - name: Build
        run: |
          echo "Building ONNX Runtime for ${{ matrix.abi }}..."
          cmake --build /tmp/build --config MinSizeRel --parallel $(nproc)
          echo "Build complete"

      - name: Strip & Collect
        run: |
          mkdir -p /tmp/output/jni/${{ matrix.abi }}
          cp /tmp/build/libonnxruntime.so /tmp/output/jni/${{ matrix.abi }}/
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so
          echo "=== Final size for ${{ matrix.abi }} ==="
          ls -lh /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-minimal-${{ matrix.abi }}
          path: /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so

  combine:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-minimal-arm64-v8a
          path: /tmp/combined/jni/arm64-v8a/

      - name: Download armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: onnxruntime-minimal-armeabi-v7a
          path: /tmp/combined/jni/armeabi-v7a/

      - name: List combined
        run: |
          ls -lh /tmp/combined/jni/*/libonnxruntime.so
          echo "=== Done! ==="

      - name: Upload Combined
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-minimal-combined
          path: /tmp/combined/
