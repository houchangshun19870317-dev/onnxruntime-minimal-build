name: Build ONNX Runtime Minimal for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip ninja-build git

      - name: Install protoc
        run: |
          sudo mkdir -p /opt/protoc
          sudo wget -q https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip -O /tmp/protoc.zip
          sudo unzip -q -o /tmp/protoc.zip -d /opt/protoc
          sudo chmod -R a+rx /opt/protoc
          /opt/protoc/bin/protoc --version

      - name: Install Android NDK
        run: |
          export ANDROID_HOME="${GITHUB_WORKSPACE}/android-sdk"
          mkdir -p "$ANDROID_HOME/ndk"
          cd "$ANDROID_HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          mv android-ndk-r26d 26.3.11579264
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Write ops config
        run: |
          BASE64_OPS="QWRkCkNhc3QKQ29uY2F0CkNvbnN0YW50T2ZTaGFwZQpDb252CkVxdWFsCkdhdGhlcgpJZGVudGl0eQpJZgpMU1RNCkxvZwpNdWwKTmVnClBhZApQb3cKUmVkdWNlTWVhbgpSZWx1ClJlc2hhcGUKU2hhcGUKU2lnbW9pZApTbGljZQpTcXJ0ClNxdWVlemUKVHJhbnNwb3NlClVuc3F1ZWV6ZQ=="
          echo "$BASE64_OPS" | base64 -d > /tmp/include_ops.config
          cat /tmp/include_ops.config

      - name: Clone ONNX Runtime
        run: |
          git clone --depth 1 --branch v1.22.0 https://github.com/microsoft/onnxruntime.git /tmp/onnxruntime

      - name: Patch eigen3 to use git
        run: |
          EIGEN_FILE=/tmp/onnxruntime/cmake/external/eigen.cmake
          sed -i 's|URL ${DEP_URL_eigen}|GIT_REPOSITORY https://gitlab.com/libeigen/eigen.git|' "$EIGEN_FILE"
          sed -i 's|URL_HASH SHA1=${DEP_SHA1_eigen}|GIT_TAG 1d8b82b0740839c0de7f1242a3585e3390ff5f33|' "$EIGEN_FILE"
          cat "$EIGEN_FILE"

      - name: Patch mlas.h to disable fp16 intrinsics
        run: |
          # MLAS_F16VEC_INTRINSICS_SUPPORTED is auto-defined for arm64. fp16 kernels in
          # core/providers/cpu/fp16/ depend on GetFusedActivationAttr from contrib_ops
          # (which is disabled). cpu_execution_provider.cc also references fp16 kernels
          # under the same macro. Disabling the macro removes both sides at once.
          # Additionally, several MLAS fp16 *.cpp files use MlasLoad/StoreFloat16x8 (also
          # gated by the macro via fp16_common.h) without their own guards, so we wrap
          # their bodies in the macro to make them empty when fp16 is disabled.
          MLAS_H=/tmp/onnxruntime/onnxruntime/core/mlas/inc/mlas.h
          python3 - <<'PY'
          import pathlib

          # 1) Disable the macro
          p = pathlib.Path("/tmp/onnxruntime/onnxruntime/core/mlas/inc/mlas.h")
          src = p.read_text()
          old = "#define MLAS_F16VEC_INTRINSICS_SUPPORTED"
          new = "// #define MLAS_F16VEC_INTRINSICS_SUPPORTED  // disabled for minimal build"
          if old in src and new not in src:
              p.write_text(src.replace(old, new, 1))
              print("Patched: MLAS_F16VEC_INTRINSICS_SUPPORTED disabled")
          else:
              print("mlas.h already patched")

          # 2) Wrap unguarded fp16 source files so their bodies vanish when the macro is off
          mlas_lib = pathlib.Path("/tmp/onnxruntime/onnxruntime/core/mlas/lib")
          targets = [
              "hqnbitgemm_kernel_neon_fp16.cpp",
              "rotary_embedding_kernel_neon_fp16.cpp",
              "halfgemm_kernel_neon_fp16.cpp",
              "softmax_kernel_neon_fp16.cpp",
              "eltwise_kernel_neon_fp16.cpp",
              "hgemm_kernel_neon.cpp",
          ]
          guard_open = "\n#ifdef MLAS_F16VEC_INTRINSICS_SUPPORTED  // wrap for minimal build\n"
          guard_close = "\n#endif  // MLAS_F16VEC_INTRINSICS_SUPPORTED (minimal build wrap)\n"
          for name in targets:
              f = mlas_lib / name
              text = f.read_text()
              if "wrap for minimal build" in text:
                  print(f"already wrapped: {name}")
                  continue
              # Insert guard after the last #include line, before the first real code
              lines = text.split("\n")
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("#include"):
                      insert_at = i + 1
              new_text = "\n".join(lines[:insert_at]) + guard_open + "\n".join(lines[insert_at:]) + guard_close
              f.write_text(new_text)
              print(f"wrapped: {name}")
          PY
          grep -n "MLAS_F16VEC_INTRINSICS_SUPPORTED" "$MLAS_H" | head -5
          echo "--- head of hqnbitgemm_kernel_neon_fp16.cpp ---"
          head -25 /tmp/onnxruntime/onnxruntime/core/mlas/lib/hqnbitgemm_kernel_neon_fp16.cpp

      - name: Configure CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${MATRIX_ABI} \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DONNX_CUSTOM_PROTOC_EXECUTABLE=/opt/protoc/bin/protoc \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -Donnxruntime_MINIMAL_BUILD=ON \
            -Donnxruntime_BUILD_SHARED_LIB=ON \
            -Donnxruntime_BUILD_UNIT_TESTS=OFF \
            -Donnxruntime_RUN_ONNX_TESTS=OFF \
            -Donnxruntime_USE_FULL_PROTOBUF=OFF \
            -Donnxruntime_DISABLE_CONTRIB_OPS=ON \
            -Donnxruntime_DISABLE_ML_OPS=ON \
            -Donnxruntime_DISABLE_RTTI=OFF \
            -Donnxruntime_DISABLE_EXCEPTIONS=OFF \
            -Donnxruntime_MINIMAL_BUILD_CUSTOM_OPS=/tmp/include_ops.config \
            -Donnxruntime_USE_OPENMP=OFF \
            -Donnxruntime_USE_XNNPACK=OFF \
            -Donnxruntime_ENABLE_TRAINING=OFF \
            -Donnxruntime_ENABLE_TRAINING_OPS=OFF \
            -Donnxruntime_ENABLE_PYTHON=OFF \
            -Donnxruntime_BUILD_JAVA=OFF \
            -Donnxruntime_BUILD_CSHARP=OFF \
            -Donnxruntime_BUILD_NODEJS=OFF \
            -Donnxruntime_BUILD_OBJC=OFF \
            -Donnxruntime_USE_COREML=OFF \
            -Donnxruntime_USE_DML=OFF \
            -Donnxruntime_USE_CUDA=OFF \
            -Donnxruntime_USE_TENSORRT=OFF \
            -Donnxruntime_USE_ROCM=OFF \
            -Donnxruntime_USE_ARMNN=OFF \
            -Donnxruntime_USE_ACL=OFF \
            -Donnxruntime_USE_SNPE=OFF \
            -Donnxruntime_USE_QNN=OFF \
            -Donnxruntime_USE_PREINSTALLED_EIGEN=OFF \
            -Donnxruntime_ENABLE_LTO=ON \
            -Donnxruntime_ENABLE_MEMLEAK_CHECKER=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-shorten-64-to-32 -Wno-error=shorten-64-to-32 -Wno-unused-const-variable -Wno-error=unused-const-variable" \
            -DCMAKE_C_FLAGS="-Wno-shorten-64-to-32 -Wno-unused-const-variable" \
            -S /tmp/onnxruntime/cmake \
            -B /tmp/build 2>&1 | tee /tmp/cmake-config.log
          echo "=== TAIL OF CONFIG LOG (last 60 lines) ==="
          tail -60 /tmp/cmake-config.log
          echo "=== ERRORS (with context) ==="
          grep -B 1 -A 4 -i "error" /tmp/cmake-config.log | head -50
        env:
          MATRIX_ABI: ${{ matrix.abi }}

      - name: Build
        run: |
          cmake --build /tmp/build --config MinSizeRel --target onnxruntime --parallel $(nproc) 2>&1 | tee /tmp/build.log
          echo "=== TAIL OF BUILD LOG (last 50 lines) ==="
          tail -50 /tmp/build.log
          echo "=== Finding artifacts ==="
          find /tmp/build -name "libonnxruntime.so" -type f 2>/dev/null

      - name: Strip and collect
        run: |
          mkdir -p /tmp/output/jni/${{ matrix.abi }}
          SO_FILE=$(find /tmp/build -name "libonnxruntime.so" -type f | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: libonnxruntime.so not found!"
            find /tmp/build -name "*.so" -type f 2>/dev/null
            exit 1
          fi
          echo "Found SO at: $SO_FILE"
          cp "$SO_FILE" /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so
          ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so
          echo "=== Final size ==="
          ls -lh /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-minimal-${{ matrix.abi }}
          path: /tmp/output/jni/${{ matrix.abi }}/libonnxruntime.so
